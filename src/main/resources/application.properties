spring.artemis.user=admin
spring.artemis.password=${ARTEMIS_PASSWORD}


#for redis cache database local
#spring.redis.host=localhost
#spring.redis.port=6379
#spring.redis.password=${REDIS_PASSWORD}

spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD}
spring.redis.database=0

jms.queue=talkkia
drop.moderation.queue=talkkia.drop.moderation
reply.moderation.queue=talkkia.reply.moderation

#for whisper transcription service
whisper.base-url=${WHISPER_TRANSCRIPTION_URL:http://whisper:9000}
whisper.api-key=${WHISPER_API_KEY}

#for OpenAI-compatible Chat Completions API
openai.base-url=${OPENAI_BASE_URL:https://api.deepseek.com}
openai.api-key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:deepseek-v4-pro}
openai.timeout-ms=${OPENAI_TIMEOUT_MS:30000}
openai.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:20000}

#for postgresql database
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://postgres:5432/talkkia}
spring.datasource.username=${POSTGRES_USER:talkkia}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.druid.initial-size=5
spring.datasource.druid.min-idle=5
spring.datasource.druid.max-active=20
spring.datasource.druid.max-wait=60000
spring.datasource.druid.validation-query=SELECT 1
spring.datasource.druid.test-while-idle=true
spring.datasource.druid.test-on-borrow=false
spring.datasource.druid.test-on-return=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.data.jpa.repositories.enabled=false

#for flyway database migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

#for neo4j database remote
#spring.neo4j.uri=bolt://195.181.246.234:7687
#spring.neo4j.authentication.username=neo4j
#spring.neo4j.authentication.password=${NEO4J_PASSWORD}
#logging.level.org.neo4j.ogm.drivers.bolt=DEBUG

#for neo4j database local
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=${NEO4J_PASSWORD}
logging.level.org.neo4j.ogm.drivers.bolt=DEBUG
logging.level.org.springframework.data.neo4j.cypher=ERROR
#bolt://20.198.155.253:7687 ip for azure neo4j database running on a docker cont
#to enable https with ssl protcol. also programatic config will be required to redirect
#from http and or enable both http and https.
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true
server.tomcat.uri-encoding=UTF-8
server.ssl.key-store=classpath:talkkia.p12
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD}
server.ssl.key-store-type=pkcs12
server.ssl.key-password=${SSL_KEY_PASSWORD}
server.ssl.enabled=true
#server.ssl.key-alias=springboot

#for file upload/download, these are temporary and will be shifted to another server
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
#Agora credintials
agora.app-id=${AGORA_APP_ID}
agora.app-certificate=${AGORA_APP_CERTIFICATE}
agora.token-expiration=3600
agora.privilege-expiration=3600
agora.joinChannelPrivilegeExpireInSeconds = 3600
agora.pubAudioPrivilegeExpireInSeconds = 3600
agora.pubVideoPrivilegeExpireInSeconds = 3600
agora.pubDataStreamPrivilegeExpireInSeconds = 3600


#Twilio credintials
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.phone-no=${TWILIO_PHONE_NUMBER}
#security tokens

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com



# Email sender configuration
mail.sender.email=${MAIL_SENDER_EMAIL}
mail.sender.name=Talkkia Support


nearby.request.count = ${NEARBY_REQUEST_COUNT:10}

